<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecionando...</title>
<link rel="preconnect" href="https://api.promosdetododia.com.br" crossorigin>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1b2a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.loader{text-align:center}
.spinner{width:40px;height:40px;border:3px solid rgba(37,211,102,.2);border-top-color:#25D366;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:14px;opacity:.7}
.error{color:#FF3B30;font-size:14px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="loader">
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Redirecionando...</div>
<div class="error" id="error"></div>
</div>

<script>
(function() {
  'use strict';

  // Server URL inline - elimina request extra do config.js
  var SERVER_URL = 'https://api.promosdetododia.com.br';

  // Pega parâmetros da URL
  var params = new URLSearchParams(window.location.search);
  var campaignSlug = params.get('c');

  if (!campaignSlug) {
    showError('Link inválido. Parâmetro de campanha não encontrado.');
    return;
  }

  // Anti-bot: rate limit simples
  var now = Date.now();
  var clickKey = 'rl_c_' + campaignSlug;
  var stored = localStorage.getItem(clickKey);
  var clickData = stored ? JSON.parse(stored) : { t: [] };
  clickData.t = clickData.t.filter(function(t) { return now - t < 60000; });
  if (clickData.t.length >= 10) {
    showError('Muitas tentativas. Aguarde um momento.');
    return;
  }
  clickData.t.push(now);
  localStorage.setItem(clickKey, JSON.stringify(clickData));

  // Coleta dados do visitante (inline, sem funções extras)
  var ua = navigator.userAgent;
  var visitor = {
    device: /tablet|ipad/i.test(ua) ? 'Tablet' : /mobile|iphone|android/i.test(ua) ? 'Mobile' : 'Desktop',
    browser: ua.indexOf('Firefox')>-1?'Firefox':ua.indexOf('SamsungBrowser')>-1?'Samsung':ua.indexOf('OPR')>-1?'Opera':ua.indexOf('Edg')>-1?'Edge':ua.indexOf('Chrome')>-1?'Chrome':ua.indexOf('Safari')>-1?'Safari':'Outro',
    os: ua.indexOf('Windows')>-1?'Windows':ua.indexOf('Android')>-1?'Android':/iPhone|iPad/.test(ua)?'iOS':ua.indexOf('Mac')>-1?'macOS':'Outro',
    referrer: document.referrer || ''
  };

  // Sequencial index
  var seqKey = 'rl_s_' + campaignSlug;
  var seqIdx = parseInt(localStorage.getItem(seqKey) || '0', 10);

  // Faz request ao servidor
  fetch(SERVER_URL + '/api/rotate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug: campaignSlug, visitor: visitor, sequentialIndex: seqIdx })
  }).then(function(resp) {
    if (!resp.ok) {
      return resp.json().catch(function() { return {}; }).then(function(err) {
        showError(err.error || 'Erro ao processar redirecionamento.');
        throw new Error('stop');
      });
    }
    return resp.json();
  }).then(function(data) {
    // Incrementa índice sequencial
    localStorage.setItem(seqKey, String(seqIdx + 1));

    // REDIRECIONA PRIMEIRO - prioridade máxima
    window.location.replace(data.url);

    // Dispara pixels DEPOIS do redirect (browser ainda executa JS pendente)
    firePixels(data.campaign, data.link);
  }).catch(function(err) {
    if (err.message !== 'stop') {
      showError('Erro ao processar redirecionamento. Tente novamente.');
    }
  });

  // ===== PIXELS DE RASTREAMENTO =====
  function firePixels(campData, link) {
    try {
      // Facebook Pixel
      if (campData.fbPixelId) {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', campData.fbPixelId);
        fbq('track', 'PageView');
        fbq('track', campData.fbEventName || 'Lead', {
          content_name: link.name || '',
          content_category: campData.name || '',
          value: 1,
          currency: 'BRL'
        });
      }

      // TikTok Pixel
      if (campData.ttPixelId) {
        !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=
        ["page","track","identify","instances","debug","on","off","once","ready","alias",
        "group","enableCookie","disableCookie"];ttq.setAndDefer=function(t,e){t[e]=function()
        {t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<
        ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t)
        {for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);
        return e};ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";
        ttq._i=ttq._i||{};ttq._i[e]=[];ttq._i[e]._u=i;ttq._t=ttq._t||{};ttq._t[e]=+new Date;
        ttq._o=ttq._o||{};ttq._o[e]=n||{};var o=document.createElement("script");o.type=
        "text/javascript";o.async=!0;o.src=i+"?sdkid="+e+"&lib="+t;var a=
        document.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};
        ttq.load(campData.ttPixelId);ttq.page();}(window,document,'ttq');
        ttq.track(campData.ttEventName || 'SubmitForm', {
          content_name: link.name || '',
          content_type: 'product'
        });
      }

      // Google Tag Manager
      if (campData.gtmId) {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),
        event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),
        dl=l!='dataLayer'?'&l='+l:'';j.async=true;
        j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
        f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer',campData.gtmId);
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: campData.gtmEventName || 'whatsapp_click',
          linkName: link.name || '',
          campaignName: campData.name || '',
          campaignSlug: campData.slug || ''
        });
      }

      // Google Ads Conversion (gtag)
      if (campData.gadsId) {
        var gs = document.createElement('script');
        gs.async = true;
        gs.src = 'https://www.googletagmanager.com/gtag/js?id=' + campData.gadsId;
        document.head.appendChild(gs);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', campData.gadsId);
        if (campData.gadsConversionLabel) {
          gtag('event', 'conversion', {
            send_to: campData.gadsId + '/' + campData.gadsConversionLabel
          });
        }
      }
    } catch(e) {}
  }

  function showError(msg) {
    document.getElementById('error').textContent = msg;
    document.getElementById('error').style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').style.display = 'none';
  }

})();
</script>
</body>
</html>
