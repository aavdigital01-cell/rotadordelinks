<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecionando...</title>
<link rel="preconnect" href="https://api.promosdetododia.com.br" crossorigin>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1b2a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.loader{text-align:center}
.spinner{width:40px;height:40px;border:3px solid rgba(37,211,102,.2);border-top-color:#25D366;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:14px;opacity:.7}
.error{color:#FF3B30;font-size:14px;margin-top:12px;display:none}
.retry-btn{display:none;margin-top:16px;padding:10px 24px;background:#25D366;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit}
.retry-btn:hover{background:#1da851}
</style>
</head>
<body>
<div class="loader">
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Redirecionando...</div>
<div class="error" id="error"></div>
<button class="retry-btn" id="retryBtn" onclick="location.reload()">Tentar novamente</button>
</div>

<script>
(function() {
  'use strict';

  var SERVER_URL = 'https://api.promosdetododia.com.br';
  var CACHE_TTL = 24 * 60 * 60 * 1000; // 24h

  var params = new URLSearchParams(window.location.search);
  var campaignSlug = params.get('c');

  if (!campaignSlug) {
    showError('Link inválido. Parâmetro de campanha não encontrado.');
    return;
  }

  // Anti-bot: rate limit simples
  var now = Date.now();
  var clickKey = 'rl_c_' + campaignSlug;
  var stored = localStorage.getItem(clickKey);
  var clickData = stored ? JSON.parse(stored) : { t: [] };
  clickData.t = clickData.t.filter(function(t) { return now - t < 60000; });
  if (clickData.t.length >= 10) {
    showError('Muitas tentativas. Aguarde um momento.');
    return;
  }
  clickData.t.push(now);
  localStorage.setItem(clickKey, JSON.stringify(clickData));

  // Coleta dados do visitante
  var ua = navigator.userAgent;
  var visitor = {
    device: /tablet|ipad/i.test(ua) ? 'Tablet' : /mobile|iphone|android/i.test(ua) ? 'Mobile' : 'Desktop',
    browser: ua.indexOf('Firefox')>-1?'Firefox':ua.indexOf('SamsungBrowser')>-1?'Samsung':ua.indexOf('OPR')>-1?'Opera':ua.indexOf('Edg')>-1?'Edge':ua.indexOf('Chrome')>-1?'Chrome':ua.indexOf('Safari')>-1?'Safari':'Outro',
    os: ua.indexOf('Windows')>-1?'Windows':ua.indexOf('Android')>-1?'Android':/iPhone|iPad/.test(ua)?'iOS':ua.indexOf('Mac')>-1?'macOS':'Outro',
    referrer: document.referrer || ''
  };

  // Sequencial index
  var seqKey = 'rl_s_' + campaignSlug;
  var seqIdx = parseInt(localStorage.getItem(seqKey) || '0', 10);

  // Fetch com timeout
  function fetchWithTimeout(url, opts, ms) {
    return new Promise(function(resolve, reject) {
      var timer = setTimeout(function() { reject(new Error('timeout')); }, ms);
      fetch(url, opts).then(function(resp) {
        clearTimeout(timer);
        resolve(resp);
      }).catch(function(err) {
        clearTimeout(timer);
        reject(err);
      });
    });
  }

  // Tenta rotate com retry
  function attemptRotate(retries) {
    return fetchWithTimeout(SERVER_URL + '/api/rotate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: campaignSlug, visitor: visitor, sequentialIndex: seqIdx })
    }, 5000).then(function(resp) {
      if (!resp.ok) {
        return resp.json().catch(function() { return {}; }).then(function(err) {
          throw new Error(err.error || 'Erro do servidor');
        });
      }
      return resp.json();
    }).catch(function(err) {
      if (retries > 0) {
        return new Promise(function(resolve) { setTimeout(resolve, 1000); }).then(function() {
          return attemptRotate(retries - 1);
        });
      }
      throw err;
    });
  }

  // Cache de URL para fallback
  var cacheKey = 'rl_url_' + campaignSlug;

  function cacheUrl(url) {
    try {
      localStorage.setItem(cacheKey, JSON.stringify({ url: url, ts: Date.now() }));
    } catch(e) {}
  }

  function getCachedUrl() {
    try {
      var data = JSON.parse(localStorage.getItem(cacheKey));
      if (data && data.url && (Date.now() - data.ts) < CACHE_TTL) return data.url;
    } catch(e) {}
    return null;
  }

  // Executa: 2 tentativas → cache fallback → erro com botão retry
  attemptRotate(1).then(function(data) {
    localStorage.setItem(seqKey, String(seqIdx + 1));
    cacheUrl(data.url);
    window.location.replace(data.url);
  }).catch(function(err) {
    var cached = getCachedUrl();
    if (cached) {
      document.getElementById('msg').textContent = 'Usando link salvo...';
      window.location.replace(cached);
    } else {
      showError(err.message || 'Erro ao processar redirecionamento.');
      document.getElementById('retryBtn').style.display = 'inline-block';
    }
  });

  function showError(msg) {
    document.getElementById('error').textContent = msg;
    document.getElementById('error').style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').style.display = 'none';
  }

})();
</script>
</body>
</html>
