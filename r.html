<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecionando...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1b2a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.loader{text-align:center}
.spinner{width:40px;height:40px;border:3px solid rgba(37,211,102,.2);border-top-color:#25D366;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:14px;opacity:.7}
.error{color:#FF3B30;font-size:14px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="loader">
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">Redirecionando...</div>
<div class="error" id="error"></div>
</div>

<script src="config.js"></script>
<script>
(function() {
  'use strict';

  var SERVER_URL = SYSTEM_CONFIG.serverUrl;

  // Pega parâmetros da URL
  var params = new URLSearchParams(window.location.search);
  var campaignSlug = params.get('c');
  var utmSource = params.get('utm_source') || '';
  var utmMedium = params.get('utm_medium') || '';
  var utmCampaign = params.get('utm_campaign') || '';

  if (!campaignSlug) {
    showError('Link inválido. Parâmetro de campanha não encontrado.');
    return;
  }

  // Anti-bot: verifica rate limit
  var now = Date.now();
  var clickKey = 'rl_clicks_' + campaignSlug;
  var clickData = JSON.parse(localStorage.getItem(clickKey) || '{"clicks":[],"blocked":false}');

  // Limpa clicks antigos (mais de 60s)
  clickData.clicks = clickData.clicks.filter(function(t) { return now - t < 60000; });

  if (clickData.clicks.length >= (SYSTEM_CONFIG.maxClicksPerMinute || 10)) {
    showError('Muitas tentativas. Aguarde um momento.');
    return;
  }

  clickData.clicks.push(now);
  localStorage.setItem(clickKey, JSON.stringify(clickData));

  // Coleta dados do visitante
  var visitorData = {
    device: getDeviceType(),
    browser: getBrowser(),
    os: getOS(),
    referrer: document.referrer || '',
    utmSource: utmSource,
    utmMedium: utmMedium,
    utmCampaign: utmCampaign
  };

  // Busca campanha e redireciona via API
  rotate(campaignSlug, visitorData);

  async function rotate(slug, visitor) {
    try {
      // Pega índice sequencial do localStorage
      var seqKey = 'rl_seq_' + slug;
      var seqIdx = parseInt(localStorage.getItem(seqKey) || '0', 10);

      var resp = await fetch(SERVER_URL + '/api/rotate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          slug: slug,
          visitor: visitor,
          sequentialIndex: seqIdx
        })
      });

      if (!resp.ok) {
        var errData = await resp.json().catch(function() { return {}; });
        if (resp.status === 404) {
          showError(errData.error || 'Campanha não encontrada ou inativa.');
        } else {
          showError(errData.error || 'Erro ao processar redirecionamento.');
        }
        return;
      }

      var data = await resp.json();
      // data = { url, campaign, link }

      // Incrementa índice sequencial
      localStorage.setItem(seqKey, String(seqIdx + 1));

      // Dispara Pixels de conversão (antes do redirect)
      firePixels(data.campaign, data.link);

      // Redireciona IMEDIATAMENTE
      window.location.replace(data.url);

      // Verifica saúde do link em background (detecta links banidos)
      checkLinkHealth(data.link, data.url);

      // Tenta pegar geolocalização e atualiza click (async, best-effort)
      fetchGeo();

    } catch (err) {
      console.error('Erro no rotacionador:', err);
      showError('Erro ao processar redirecionamento. Tente novamente.');
    }
  }

  async function fetchGeo() {
    try {
      var resp = await fetch(SYSTEM_CONFIG.geoApiUrl || 'https://ipapi.co/json/');
      if (resp.ok) {
        var geo = await resp.json();
        // Geo data já foi coletada, mas o click já foi registrado server-side
        // Se quiser atualizar com geo, precisaria de um endpoint separado
        // Por ora o IP é capturado server-side via req.ip
      }
    } catch (e) {
      // Geo é best-effort
    }
  }

  function getDeviceType() {
    var ua = navigator.userAgent;
    if (/tablet|ipad|playbook|silk/i.test(ua)) return 'Tablet';
    if (/mobile|iphone|ipod|android|blackberry|opera mini|iemobile/i.test(ua)) return 'Mobile';
    return 'Desktop';
  }

  function getBrowser() {
    var ua = navigator.userAgent;
    if (ua.indexOf('Firefox') > -1) return 'Firefox';
    if (ua.indexOf('SamsungBrowser') > -1) return 'Samsung';
    if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) return 'Opera';
    if (ua.indexOf('Edg') > -1) return 'Edge';
    if (ua.indexOf('Chrome') > -1) return 'Chrome';
    if (ua.indexOf('Safari') > -1) return 'Safari';
    return 'Outro';
  }

  function getOS() {
    var ua = navigator.userAgent;
    if (ua.indexOf('Windows') > -1) return 'Windows';
    if (ua.indexOf('Mac') > -1) return 'macOS';
    if (ua.indexOf('Android') > -1) return 'Android';
    if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
    if (ua.indexOf('Linux') > -1) return 'Linux';
    return 'Outro';
  }

  // ===== PIXELS DE RASTREAMENTO =====
  function firePixels(campData, link) {
    try {
      // Facebook Pixel
      if (campData.fbPixelId) {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', campData.fbPixelId);
        fbq('track', 'PageView');
        fbq('track', campData.fbEventName || 'Lead', {
          content_name: link.name || '',
          content_category: campData.name || '',
          value: 1,
          currency: 'BRL'
        });
      }

      // TikTok Pixel
      if (campData.ttPixelId) {
        !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=
        ["page","track","identify","instances","debug","on","off","once","ready","alias",
        "group","enableCookie","disableCookie"];ttq.setAndDefer=function(t,e){t[e]=function()
        {t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<
        ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t)
        {for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);
        return e};ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";
        ttq._i=ttq._i||{};ttq._i[e]=[];ttq._i[e]._u=i;ttq._t=ttq._t||{};ttq._t[e]=+new Date;
        ttq._o=ttq._o||{};ttq._o[e]=n||{};var o=document.createElement("script");o.type=
        "text/javascript";o.async=!0;o.src=i+"?sdkid="+e+"&lib="+t;var a=
        document.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};
        ttq.load(campData.ttPixelId);ttq.page();}(window,document,'ttq');
        ttq.track(campData.ttEventName || 'SubmitForm', {
          content_name: link.name || '',
          content_type: 'product'
        });
      }

      // Google Tag Manager
      if (campData.gtmId) {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),
        event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),
        dl=l!='dataLayer'?'&l='+l:'';j.async=true;
        j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
        f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer',campData.gtmId);
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: campData.gtmEventName || 'whatsapp_click',
          linkName: link.name || '',
          campaignName: campData.name || '',
          campaignSlug: campData.slug || ''
        });
      }

      // Google Ads Conversion (gtag)
      if (campData.gadsId) {
        var gs = document.createElement('script');
        gs.async = true;
        gs.src = 'https://www.googletagmanager.com/gtag/js?id=' + campData.gadsId;
        document.head.appendChild(gs);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', campData.gadsId);
        if (campData.gadsConversionLabel) {
          gtag('event', 'conversion', {
            send_to: campData.gadsId + '/' + campData.gadsConversionLabel
          });
        }
      }
    } catch(e) {
      // Pixels são best-effort, nunca bloqueiam o redirect
    }
  }

  // ===== VERIFICAÇÃO DE LINK QUEBRADO =====
  async function checkLinkHealth(link, url) {
    try {
      var controller = new AbortController();
      var timeoutId = setTimeout(function() { controller.abort(); }, 5000);

      await fetch(url, {
        method: 'HEAD',
        mode: 'no-cors',
        signal: controller.signal
      });
      clearTimeout(timeoutId);
    } catch (e) {
      if (e.name === 'AbortError' || e.message.includes('network') || e.message.includes('Failed to fetch')) {
        // Report broken link to server
        fetch(SERVER_URL + '/api/report-broken-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ linkId: link.id })
        }).catch(function() {});
      }
    }
  }

  function showError(msg) {
    var el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').style.display = 'none';
  }

})();
</script>
</body>
</html>
